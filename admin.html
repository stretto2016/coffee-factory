<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRETTO ADMIN - 통합 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 20px; font-family: 'Noto Sans KR', sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #111; border-bottom: 2px solid ##2997ff; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #eee; border-radius: 8px; cursor: pointer; font-weight: bold; color: #666; }
        .tab-btn.active { background: #2997ff; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        th { text-align: left; padding: 12px; background: #f0f0f0; border-bottom: 2px solid #ddd; color: #555; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 5px; }
        .btn-done { background: #2997ff; color: rgb(0, 0, 0); }
        .btn-del { background: #ff453a; color: white; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: #555; margin-bottom: 5px; }
        .form-input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.95rem; }
        .form-input:focus { border-color: #2997ff; outline: none; }
        .full-width { grid-column: span 2; }
        .form-box { background: #f9f9f9; padding: 25px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 20px; }
        
        /* 배합 비율 리스트 스타일 */
        .ingredient-row { display: flex; gap: 10px; margin-bottom: 5px; align-items: center; }
        .ingredient-row select { flex: 2; }
        .ingredient-row input { flex: 1; text-align: right; }
        .remove-btn { color: #ff453a; cursor: pointer; font-weight: bold; padding: 5px; }

        #login-section { text-align: center; margin: 100px auto; max-width: 400px; }
        .hidden { display: none; }
        .preview-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; color: white; font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; }
        .section-title { font-size: 0.9rem; font-weight: bold; color: #2997ff; border-bottom: 2px solid #e5e5e5; padding-bottom: 5px; margin: 20px 0 10px 0; }
    </style>
</head>
<body>

    <div id="login-section">
        <h2>ADMIN LOGIN</h2>
        <input type="text" id="adminId" class="form-input" placeholder="관리자 이메일" style="margin-bottom:10px;">
        <input type="password" id="adminPw" class="form-input" placeholder="비밀번호" style="margin-bottom:20px;">
        <button onclick="adminLogin()" class="btn btn-done" style="width:100%; padding:15px;">로그인</button>
    </div>

    <div id="dashboard-section" class="container hidden">
        <h1>
            STRETTO 통합 관리
            <button onclick="logout()" class="btn" style="background:#ddd; color:#333;">로그아웃</button>
        </h1>
        
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('orders')">주문 관리</button>
            <button class="tab-btn" onclick="switchTab('products')">상품 관리 (앱 연동)</button>
        </div>

        <div id="tab-orders" class="tab-content active">
            <table>
                <thead>
                    <tr>
                        <th style="width: 100px;">날짜</th>
                        <th style="width: 150px;">거래처</th>
                        <th>품목 (수량)</th>
                        <th>요청사항</th>
                        <th style="width: 120px;">상태</th>
                    </tr>
                </thead>
                <tbody id="orderList"></tbody>
            </table>
        </div>

        <div id="tab-products" class="tab-content">
            <div class="form-box">
                <h3 style="margin-top:0; margin-bottom:20px; border-bottom:1px solid #ddd; padding-bottom:10px;">📦 상품 등록 / 수정</h3>
                <input type="hidden" id="editDocId">
                
                <div class="section-title">1. 기본 정보 & 이름</div>
                <div class="input-group">
                    <div>
                        <label class="form-label">카테고리</label>
                        <select id="pCategory" class="form-input" onchange="toggleDetailName()">
    <option value="blend">블렌드 (Blend)</option>
    <option value="single_nutty">싱글 - 고소함 (Nutty & Heavy)</option>
    <option value="single_fruity">싱글 - 산미/꽃 (Fruity & Floral)</option>
    <option value="decaf">디카페인 (Decaf)</option>
</select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label class="form-label">노출 순서 (1=맨앞)</label>
                            <input type="number" id="pOrder" class="form-input" placeholder="999" value="999">
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">로스팅 손실률 (0.15 = 15%)</label>
                            <input type="number" step="0.01" id="pShrinkage" class="form-input" value="0.15">
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <div>
                        <label class="form-label" id="labelGroupName">제품명 (예: 에티오피아)</label>
                        <input type="text" id="pGroupName" class="form-input" placeholder="메인 이름">
                    </div>
                    <div id="divDetailName" style="display:none;">
                        <label class="form-label">상세 구분 (예: G1, 버전)</label>
                        <input type="text" id="pDetailName" class="form-input" placeholder="블렌드 상세명">
                    </div>
                </div>

                <div class="section-title">2. 판매 가격</div>
                <div class="input-group">
                    <div>
                        <label class="form-label">홈페이지(Shop) 판매가 (B2C)</label>
                        <input type="text" id="pPriceShop" class="form-input" placeholder="숫자만 입력">
                    </div>
                    <div>
                        <label class="form-label">파트너(B2B) 납품가</label>
                        <input type="text" id="pPriceB2B" class="form-input" placeholder="숫자만 입력">
                    </div>
                </div>

                <div class="section-title">3. 포장/부자재 비용 (건당)</div>
                <div class="input-group" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
                    <div>
                        <label class="form-label">봉투</label>
                        <input type="number" id="costBag" class="form-input" value="300">
                    </div>
                    <div>
                        <label class="form-label">라벨</label>
                        <input type="number" id="costLabel" class="form-input" value="50">
                    </div>
                    <div>
                        <label class="form-label">속지/박스</label>
                        <input type="number" id="costBox" class="form-input" value="100">
                    </div>
                    <div>
                        <label class="form-label">기타</label>
                        <input type="number" id="extraCost" class="form-input" value="0">
                    </div>
                </div>

                <div class="section-title">4. 생두 배합 (Recipe)</div>
                <div style="background: white; padding: 15px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 15px;">
                    <div id="ingredientList"></div>
                    <button onclick="addIngredientRow()" class="btn" style="background:#eee; margin-top:10px; width:100%;">+ 생두 추가하기</button>
                </div>

                <div class="section-title">5. 상세 정보 (홈페이지용)</div>
                <div class="input-group">
                    <div style="display: flex; gap: 15px;" class="full-width">
                        <div style="flex: 1.5;">
                            <label class="form-label">뱃지 텍스트</label>
                            <input type="text" id="pBadge" class="form-input" placeholder="BEST, NEW">
                        </div>
                        
                        <div style="flex: 1;">
                            <label class="form-label">배경 색상</label>
                            <div style="display: flex; gap: 5px;">
                                <input type="color" id="pBadgeColor" class="form-input" value="#333333" 
                                       style="height: 42px; padding: 2px; width: 50px; flex:none; cursor: pointer;"
                                       oninput="document.getElementById('pBadgeColorText').value = this.value">
                                <input type="text" id="pBadgeColorText" class="form-input" value="#333333" 
                                       oninput="document.getElementById('pBadgeColor').value = this.value">
                            </div>
                        </div>

                        <div style="flex: 1;">
                            <label class="form-label">글씨 색상</label>
                            <div style="display: flex; gap: 5px;">
                                <input type="color" id="pBadgeTextColor" class="form-input" value="#ffffff" 
                                       style="height: 42px; padding: 2px; width: 50px; flex:none; cursor: pointer;"
                                       oninput="document.getElementById('pBadgeTextColorText').value = this.value">
                                <input type="text" id="pBadgeTextColorText" class="form-input" value="#ffffff" 
                                       oninput="document.getElementById('pBadgeTextColor').value = this.value">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="input-group">
                    <div class="full-width">
                        <label class="form-label">컵노트</label>
                        <input type="text" id="pNote" class="form-input" placeholder="예: 다크초콜릿 · 아몬드">
                    </div>
                </div>
                <div class="input-group">
                    <div class="full-width">
                        <label class="form-label">상품 설명</label>
                        <input type="text" id="pDesc" class="form-input" placeholder="설명 입력">
                    </div>
                </div>
                <div class="input-group">
                    <div class="full-width">
                        <label class="form-label">이미지 경로</label>
                        <input type="text" id="pImageUrl" class="form-input" placeholder="images/coffee.jpg">
                    </div>
                </div>
                <div class="input-group">
                    <div class="full-width">
                        <label class="form-label">스마트스토어 링크</label>
                        <input type="text" id="pLink" class="form-input" placeholder="http://...">
                    </div>
                </div>

                <div class="input-group">
                    <div class="full-width" style="background: white; padding: 15px; border-radius: 6px; border: 1px solid #ddd;">
                        <label class="form-label" style="margin-bottom: 10px;">노출 설정</label>
                        <div style="display:flex; gap:20px;">
                            <label style="cursor:pointer;"><input type="checkbox" id="showShop" checked> 홈페이지(Shop) 노출</label>
                            <label style="cursor:pointer;"><input type="checkbox" id="showPartner" checked> 파트너(B2B) 노출</label>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="saveProduct()" class="btn btn-done" style="flex: 2; padding: 12px; font-size: 1rem;">저장하기</button>
                    <button onclick="resetForm()" class="btn" style="flex: 1; padding: 12px; background: #ddd; color: #333;">초기화</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">이미지</th>
                        <th>상품 정보</th>
                        <th>노출</th>
                        <th style="width: 120px;">관리</th>
                    </tr>
                </thead>
                <tbody id="productList"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
             apiKey: "AIzaSyAUjfrQ-HVivBLggiOl8vvRZynala1qqyM",
             authDomain: "roastery-f3e2e.firebaseapp.com",
             projectId: "roastery-f3e2e",
             storageBucket: "roastery-f3e2e.firebasestorage.app",
             messagingSenderId: "79814680110",
             appId: "1:79814680110:web:86aa08fe0e273fed6649bf"
        };

        const ADMIN_EMAIL = "strettopark@gmail.com"; 

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let beanList = []; // 생두 리스트

        // --- 로그인 및 초기화 ---
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadBeans(); // 생두 먼저 불러오기
                loadAllOrders();
                loadAllProducts();
            } else if (user) {
                alert("관리자 권한이 없습니다.");
                signOut(auth);
            }
        });

        // 생두 목록 불러오기 (레시피 선택용)
        async function loadBeans() {
            const q = query(collection(db, "beans"), orderBy("name"));
            const snapshot = await getDocs(q);
            beanList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        window.adminLogin = () => {
            const id = document.getElementById('adminId').value;
            const pw = document.getElementById('adminPw').value;
            signInWithEmailAndPassword(auth, id, pw).catch(alert);
        };
        window.logout = () => signOut(auth);
        
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
        };

        // --- UI 로직 ---
        window.toggleDetailName = () => {
            const cat = document.getElementById('pCategory').value;
            const detailDiv = document.getElementById('divDetailName');
            const groupLabel = document.getElementById('labelGroupName');
            
            if (cat === 'blend') {
                detailDiv.style.display = 'block';
                groupLabel.innerText = "블렌드명 (예: 스트레토 블렌드)";
            } else {
                detailDiv.style.display = 'none';
                groupLabel.innerText = "제품명 (예: 에티오피아)";
            }
        };

        window.addIngredientRow = (beanName = "", ratio = 1.0) => {
            const container = document.getElementById('ingredientList');
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            
            let options = `<option value="" disabled selected>생두 선택</option>`;
            beanList.forEach(b => {
                const selected = b.name === beanName ? "selected" : "";
                options += `<option value="${b.name}" ${selected}>${b.name}</option>`;
            });

            row.innerHTML = `
                <select class="form-input bean-select">${options}</select>
                <input type="number" step="0.1" class="form-input bean-ratio" value="${ratio}" placeholder="비율">
                <span class="remove-btn" onclick="this.parentElement.remove()">✕</span>
            `;
            container.appendChild(row);
        };

        // --- 1. 주문 관리 ---
        function loadAllOrders() {
            const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('orderList');
                if (snapshot.empty) { list.innerHTML = '<tr><td colspan="5">주문 내역 없음</td></tr>'; return; }
                list.innerHTML = snapshot.docs.map(doc => {
                    const d = doc.data();
                    const isDone = d.status === 'done';
                    return `<tr style="${isDone ? 'opacity:0.5; background:#f9f9f9;' : ''}">
                        <td>${d.date}</td>
                        <td style="font-weight:bold;">${d.clientName}</td>
                        <td>${d.productType} <span style="color:#2997ff; font-weight:bold;">${d.amountKg}kg</span></td>
                        <td>${d.note || '-'}</td>
                        <td>
                            <button class="btn ${isDone?'':'btn-done'}" onclick="updateOrderStatus('${doc.id}', '${isDone?'new':'done'}')">${isDone?'복구':'완료'}</button>
                            <button class="btn btn-del" onclick="deleteOrder('${doc.id}')">삭제</button>
                        </td>
                    </tr>`;
                }).join('');
            });
        }
        window.updateOrderStatus = (id, st) => updateDoc(doc(db, "orders", id), { status: st });
        window.deleteOrder = (id) => confirm("삭제하시겠습니까?") && deleteDoc(doc(db, "orders", id));

        // --- 2. 상품 관리 (앱 연동 완벽 지원) ---
        function loadAllProducts() {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('productList');
                list.innerHTML = snapshot.docs.map(doc => {
                    const p = doc.data();
                    const imgShow = p.imageUrl ? `<img src="${p.imageUrl}" width="50" height="50" style="object-fit:cover; border-radius:4px;">` : `<div style="width:50px;height:50px;background:#eee;">No Img</div>`;
                    
                    // 따옴표 문제 방지
                    const pString = encodeURIComponent(JSON.stringify({id: doc.id, ...p}));
                    
                    // [수정] 리스트에서 뱃지 미리보기 스타일 적용
let badgeHtml = '';
if (p.badge) {
    const bg = p.badgeColor || '#333';
    const txt = p.badgeTextColor || '#fff';
    badgeHtml = `<span class="preview-badge" style="background-color: ${bg}; color: ${txt};">${p.badge}</span>`;
}

                    return `<tr>
                        <td>${imgShow}</td>
                        <td>
                            ${badgeHtml}
                            <div style="font-weight:bold;">${p.name}</div>
                            <div style="font-size:0.75rem; color:#888;">${p.groupName || '-'} / ${p.category}</div>
                            <div style="font-size:0.8rem; margin-top:4px;">
                                샵: <b>${Number(p.price).toLocaleString()}원</b> / 
                                B2B: <b style="color:#2997ff">${Number(p.priceB2B || p.price).toLocaleString()}원</b>
                            </div>
                        </td>
                        <td>
                            ${p.showShop ? '<span class="status-badge status-new">Shop</span>' : ''}
                            ${p.showPartner ? '<span class="status-badge status-done">B2B</span>' : ''}
                        </td>
                        <td>
                            <button class="btn" style="background:#ddd;" onclick="editProduct('${pString}')">수정</button>
                            <button class="btn btn-del" onclick="deleteProduct('${doc.id}')">삭제</button>
                        </td>
                    </tr>`;
                }).join('');
            });
        }

        window.saveProduct = async () => {
            const category = document.getElementById('pCategory').value;
            const groupName = document.getElementById('pGroupName').value;
            const detailName = document.getElementById('pDetailName').value;
            const shrinkage = document.getElementById('pShrinkage').value;
            const orderIndex = document.getElementById('pOrder').value;
            const priceShop = document.getElementById('pPriceShop').value;
            const priceB2B = document.getElementById('pPriceB2B').value;
            
            const costBag = document.getElementById('costBag').value;
            const costLabel = document.getElementById('costLabel').value;
            const costBox = document.getElementById('costBox').value;
            const extraCost = document.getElementById('extraCost').value;

            const badge = document.getElementById('pBadge').value;
            const badgeColor = document.getElementById('pBadgeColor').value;
            const badgeTextColor = document.getElementById('pBadgeTextColor').value;
            const cupNote = document.getElementById('pNote').value;
            const desc = document.getElementById('pDesc').value;
            const link = document.getElementById('pLink').value;
            const imageUrl = document.getElementById('pImageUrl').value;
            const showShop = document.getElementById('showShop').checked;
            const showPartner = document.getElementById('showPartner').checked;
            const editId = document.getElementById('editDocId').value;

            if (!groupName || !priceShop) return alert("상품명(그룹명)과 샵 가격은 필수입니다.");

            // 이름 조합 로직 (앱과 동일하게 맞춤)
            let fullName = groupName;
            if (category === 'blend' && detailName) {
                fullName = `${groupName} (${detailName})`;
            }

            // 배합 정보 수집
            const composition = {};
            document.querySelectorAll('.ingredient-row').forEach(row => {
                const beanName = row.querySelector('.bean-select').value;
                const ratio = row.querySelector('.bean-ratio').value;
                if(beanName && ratio) {
                    composition[beanName] = Number(ratio);
                }
            });

            // 데이터 객체 생성
            const data = {
                name: fullName,
                groupName, detailName, category,
                shrinkage: Number(shrinkage),
                orderIndex: Number(orderIndex || 999), // [추가] 순서 저장 (없으면 999)
                
                price: Number(priceShop),
                priceB2B: Number(priceB2B || priceShop), // B2B
                priceShop: Number(priceShop),    // 앱 호환용 명시
                
                costBag: Number(costBag),
                costLabel: Number(costLabel),
                costBox: Number(costBox),
                extraCost: Number(extraCost),
                
                composition, // 배합 정보 저장
                
                badge, badgeColor, badgeTextColor, cupNote, description: desc, shopLink: link, imageUrl, 
                showShop, showPartner,
                createdAt: Date.now()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "products", editId), data);
                    alert("수정 완료");
                } else {
                    await addDoc(collection(db, "products"), data);
                    alert("등록 완료");
                }
                resetForm();
            } catch(e) { console.error(e); alert("저장 실패"); }
        };

        window.editProduct = (pString) => {
            const p = JSON.parse(decodeURIComponent(pString));

            document.getElementById('editDocId').value = p.id;
            
            // 1. 기본 정보 채우기
            document.getElementById('pCategory').value = p.category || 'single';
            // [추가] 순서 값 불러오기
            document.getElementById('pOrder').value = p.orderIndex !== undefined ? p.orderIndex : 999;
            window.toggleDetailName(); // UI 업데이트
            
            // 이름 분리 (혹시 데이터에 groupName이 없을 경우 대비)
            if (p.groupName) {
                document.getElementById('pGroupName').value = p.groupName;
                document.getElementById('pDetailName').value = p.detailName || '';
            } else {
                // 구버전 데이터 호환
                const parts = p.name.split(' (');
                document.getElementById('pGroupName').value = parts[0];
                document.getElementById('pDetailName').value = parts.length > 1 ? parts[1].replace(')', '') : '';
            }

            document.getElementById('pShrinkage').value = p.shrinkage || 0.15;

            // 2. 가격 및 비용
            document.getElementById('pPriceShop').value = p.price; 
            document.getElementById('pPriceB2B').value = p.priceB2B || p.price;
            
            document.getElementById('costBag').value = p.costBag || 300;
            document.getElementById('costLabel').value = p.costLabel || 50;
            document.getElementById('costBox').value = p.costBox || 100;
            document.getElementById('extraCost').value = p.extraCost || 0;

            // 3. 배합 정보 채우기
            const container = document.getElementById('ingredientList');
            container.innerHTML = ''; // 초기화
            if (p.composition) {
                Object.entries(p.composition).forEach(([bean, ratio]) => {
                    addIngredientRow(bean, ratio);
                });
            } else {
                // 배합 정보 없으면 빈 줄 하나 추가
                addIngredientRow();
            }

            // 4. 상세 정보
            document.getElementById('pBadge').value = p.badge || '';
            // 뱃지 색상 불러오기
            const bColor = p.badgeColor || '#333333';
document.getElementById('pBadgeColor').value = bColor;
document.getElementById('pBadgeColorText').value = bColor;

// [추가] 뱃지 글씨색
const tColor = p.badgeTextColor || '#ffffff';
document.getElementById('pBadgeTextColor').value = tColor;
document.getElementById('pBadgeTextColorText').value = tColor;
            document.getElementById('pNote').value = p.cupNote || '';
            document.getElementById('pDesc').value = p.description || '';
            document.getElementById('pLink').value = p.shopLink || '';
            document.getElementById('pImageUrl').value = p.imageUrl || '';
            document.getElementById('showShop').checked = p.showShop;
            document.getElementById('showPartner').checked = p.showPartner;
            
            window.scrollTo(0, 0);
        };

        window.deleteProduct = async (id) => {
            if(confirm("정말 삭제하시겠습니까?")) await deleteDoc(doc(db, "products", id));
        };

        window.resetForm = () => {
            document.getElementById('editDocId').value = '';
            document.querySelectorAll('.form-input').forEach(i => i.value = '');
            
            // 기본값 복구
            document.getElementById('pCategory').value = 'single';
            document.getElementById('pOrder').value = '999'; // [추가] 순서 초기화
            toggleDetailName();
            document.getElementById('pShrinkage').value = 0.15;
            document.getElementById('costBag').value = 300;
            document.getElementById('costLabel').value = 50;
            document.getElementById('costBox').value = 100;
            document.getElementById('extraCost').value = 0;
            // 뱃지 색상 초기화
            document.getElementById('pBadgeColor').value = '#333333';
document.getElementById('pBadgeColorText').value = '#333333';

document.getElementById('pBadgeTextColor').value = '#ffffff';
document.getElementById('pBadgeTextColorText').value = '#ffffff';
            
            document.getElementById('ingredientList').innerHTML = '';
            addIngredientRow(); // 빈 줄 하나 추가

            document.getElementById('showShop').checked = true;
            document.getElementById('showPartner').checked = true;
        };
    </script>
</body>
</html>
