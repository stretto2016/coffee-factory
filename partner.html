<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트레토 간편 발주</title>
    <style>
        /* === 기본 설정 === */
        @font-face { font-family: 'Ciutadella'; src: url('Ciutadella-Regular.otf') format('opentype'); }
        :root { --accent-blue: #2997ff; --bg-dark: #111; --card-bg: #1c1c1e; }
        
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background-color: #000; color: #f5f5f7; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; background: #000; display: flex; flex-direction: column; position: relative; }

        header { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        h2 { font-family: 'Ciutadella', sans-serif; margin: 0 0 5px 0; color: var(--accent-blue); }
        .client-info-box { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #333; font-size: 0.9rem; color: #ccc; }
        .client-info-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .info-label { color: #666; }
        .info-value { font-weight: bold; color: white; text-align: right; }
        
        .grid-section { margin-bottom: 30px; }
        .grid-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #f5f5f7; border-left: 3px solid var(--accent-blue); padding-left: 10px; display: flex; align-items: center; justify-content: space-between; }
        .grid-desc { font-size: 0.75rem; color: #888; font-weight: normal; }
        
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        /* === 상품 카드 스타일 === */
        .product-btn { 
            position: relative;
            background: var(--card-bg); 
            border: 1px solid #333; 
            color: white; 
            padding: 15px; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: left; 
            transition: all 0.2s ease; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            /* [수정] 고정 높이 제거 및 최소 높이 확보 (텍스트 오버플로우 방지) */
            height: auto; 
            min-height: 115px; 
        }
        .product-btn:active { transform: scale(0.96); }

        .product-btn.active {
            border: 2px solid var(--accent-blue);
            background: rgba(41, 151, 255, 0.15); 
            box-shadow: 0 0 15px rgba(41, 151, 255, 0.1);
        }
        /* [추가] 단위 뱃지 스타일 */
        /* [수정] 디자인 개선: 단위 뱃지 스타일 */
        /* === 상품 카드 스타일 (Premium Dashboard Look) === */
        .product-btn { 
            position: relative;
            background: #1c1c1e; 
            /* 테두리를 아주 연하게 변경 */
            border: 1px solid #2c2c2e; 
            /* 왼쪽 억양 선을 위한 패딩 설정 */
            border-left: 4px solid #333; 
            color: white; 
            padding: 16px 18px; 
            border-radius: 4px; /* 라운드를 줄여서 더 단단하고 전문적인 느낌 */
            cursor: pointer; 
            text-align: left; 
            transition: all 0.2s ease; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            
            /* [높이 문제 해결] 내용에 따라 늘어나되 최소 높이 확보 */
            height: auto; 
            min-height: 110px; 
        }

        .product-btn:active { transform: scale(0.98); }

        /* [선택됨] 배경색을 거의 투명하게, 테두리로만 강조 */
        .product-btn.active {
            background: #1c1c1e; 
            border-color: var(--accent-blue); /* 전체 테두리 파랗게 */
            border-left-width: 4px; /* 왼쪽 선 두께 유지 */
            box-shadow: 0 0 20px rgba(41, 151, 255, 0.1); /* 은은한 발광 효과 */
        }

        /* === 단위 표시 (뱃지 대신 텍스트 라벨) === */
        /* === 상품 카드 스타일 (Premium Dashboard Look v2) === */
        .product-btn { 
            position: relative;
            background: #1c1c1e; 
            /* 테두리를 아주 연하게 */
            border: 1px solid #2c2c2e; 
            /* 왼쪽 억양 선(Accent Line) - 기본값 */
            border-left: 4px solid #333; 
            color: white; 
            padding: 16px 18px; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: left; 
            transition: all 0.2s ease; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            
            /* 높이 자동 조절 (내용 잘림 방지) */
            height: auto; 
            min-height: 115px; 
        }

        .product-btn:active { transform: scale(0.98); }

        /* [선택됨] 배경색 투명도 유지, 테두리 강조 */
        .product-btn.active {
            background: #1c1c1e; 
            border-color: var(--accent-blue); 
            border-left-width: 4px; 
            box-shadow: 0 0 20px rgba(41, 151, 255, 0.1); 
        }

        /* === 단위 표시 (업그레이드: 세련된 캡슐 스타일) === */
        .unit-badge {
            display: inline-block; /* 텍스트 크기에 딱 맞게 박스 형성 */
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 4px 10px;      /* 내부 여백을 줘서 캡슐 모양 생성 */
            border-radius: 4px;     /* 살짝 둥근 모서리 */
            margin-bottom: 10px;
            text-transform: uppercase;
            line-height: 1;
        }

        /* 100g 단위: 차분한 아웃라인 스타일 (고급스러움) */
        .badge-small {
            border: 1px solid #444;
            color: #aaa;
            background: transparent; /* 배경 없음 */
        }
        /* 100g 카드 왼쪽 라인 */
        .product-btn.single {
            border-left-color: #555; 
        }

        /* 1kg 팩: 은은한 블루 배경으로 강조 (눈에 띔) */
        .badge-bulk {
            background: rgba(41, 151, 255, 0.15); /* 투명한 파란 배경 */
            border: 1px solid rgba(41, 151, 255, 0.3); /* 연한 파란 테두리 */
            color: #6ebbff; /* 밝은 파란 글씨 */
        }
        /* 1kg 카드 왼쪽 라인 */
        .product-btn.pack-1kg {
            border-left-color: var(--accent-blue); /* 왼쪽 라인 파란색 */
            /* 1kg는 배경도 아주 미세하게 푸른빛을 돌게 하여 덩어리감 부여 */
            background: linear-gradient(90deg, rgba(41,151,255,0.03) 0%, rgba(28,28,30,1) 100%);
        }


        /* 카운트 뱃지 (우측 상단) */
        .count-badge {
            position: absolute;
            top: 12px; right: 12px;
            background: var(--accent-blue);
            color: #000;
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 800;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 5;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0); opacity:0; } to { transform: scale(1); opacity:1; } }
        
        /* 텍스트 스타일 */
        .p-name { 
            font-family: 'Pretendard', sans-serif;
            font-weight: 500; 
            font-size: 1.05rem; 
            line-height: 1.4; 
            color: #f5f5f7;
            word-break: keep-all; 
        }
        .p-sub { font-size: 0.8rem; color: #666; margin-top: 5px; }
        
        .product-btn.active .p-name { color: var(--accent-blue); font-weight: 600; }
        .product-btn.active .p-sub { color: #aaa; }
        .price-row {
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-top: 10px;
        }
        /* [끝] */

        /* === 플로팅 장바구니 스타일 === */
        .cart-section { 
            display: none;
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 460px;
            
            background: rgba(28, 28, 30, 0.98);
            backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 0 20px;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            z-index: 99;
            
            transition: all 0.3s ease;
            max-height: 50vh;
            overflow: hidden;
        }
        
        .cart-section.folded {
            max-height: 56px;
            overflow: hidden;
            padding-bottom: 0;
        }

        .cart-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; 
            padding: 15px 0;
            position: sticky; top: 0; background: transparent;
            cursor: pointer;
        }
        
        .cart-toggle-icon {
            transition: transform 0.3s;
            font-size: 0.8rem;
            color: #888;
            margin-left: 8px;
        }
        
        .cart-section.folded .cart-toggle-icon { transform: rotate(180deg); }
        .cart-section.folded .cart-header { border-bottom: none; }

        .cart-body {
            padding-bottom: 20px;
            overflow-y: auto;
            max-height: calc(50vh - 60px);
        }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333; }
        .cart-item:last-child { border-bottom: none; }
        .cart-info { display: flex; flex-direction: column; }
        .cart-name { font-weight: bold; font-size: 0.95rem; }
        .cart-type { font-size: 0.75rem; color: #888; }
        .qty-control { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #444; color: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .qty-val-box { width: 50px; text-align: center; }
        .qty-val { width: 100%; text-align: center; font-weight: bold; background: transparent; border: none; color: white; font-size: 1rem; }
        .qty-unit { font-size: 0.7rem; color: #888; display: block; text-align: center;}
        .del-btn { color: #ff453a; background: none; border: none; margin-left: 5px; cursor: pointer; padding: 5px; }
        
        .bottom-action { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 15px; border-top: 1px solid #333; text-align: center; display: flex; justify-content: center; z-index: 100; }
        .submit-btn { width: 100%; max-width: 440px; padding: 18px; background: var(--accent-blue); color: rgb(0, 0, 0); border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(41, 151, 255, 0.3); }
        .submit-btn:disabled { background: #333; color: #666; box-shadow: none; }
        
        #login-section { text-align: center; margin-top: 100px; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 15px; background: white; color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .hidden { display: none !important; }

        .date-picker { width: 100%; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 8px; margin-top: 5px; font-family: inherit; box-sizing: border-box; }
        
        .history-section { margin-top: 40px; border-top: 1px solid #333; padding-top: 30px; }
        .history-card { background: #151515; border-radius: 8px; padding: 15px; margin-bottom: 10px; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .h-date { font-size: 0.8rem; color: var(--accent-blue); font-weight: bold; margin-bottom: 2px;}
        .h-name { font-weight: bold; font-size: 1rem; }
        .h-detail { font-size: 0.85rem; color: #888; }
        .h-amount { font-weight: bold; font-size: 1.1rem; color: white; }
        .cancel-btn { background: #330000; border: 1px solid #660000; color: #ff453a; font-size: 0.8rem; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 10px;}
        .cancel-btn.disabled { background: #222; border-color: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-section">
            <h1 style="font-family: 'Ciutadella'; margin-bottom: 30px;">PARTNER LOGIN</h1>
            <input type="text" id="loginId" class="login-input" placeholder="아이디 (예: gongdeok)">
            <input type="password" id="password" class="login-input" placeholder="비밀번호">
            <button id="loginBtn" class="login-btn">로그인</button>
            <p id="login-msg" style="color: #ff453a; margin-top: 15px; font-size: 0.9rem;"></p>
        </div>

        <div id="order-section" class="hidden">
            <header>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>NEW ORDER</h2>
                    <button id="logoutBtn" style="background:none; border:none; color:#666; cursor:pointer;">로그아웃</button>
                </div>
                
                <div class="client-info-box">
                    <div class="client-info-row">
                        <span class="info-label">업체명</span>
                        <span class="info-value" id="disp-name">로딩 중...</span>
                    </div>
                    <div class="client-info-row">
                        <span class="info-label">주소</span>
                        <span class="info-value" id="disp-address" style="font-weight:normal; font-size:0.8rem;">-</span>
                    </div>
                    <div style="margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
                        <span class="info-label">주문 날짜</span>
                        <input type="date" id="orderDate" class="date-picker">
                    </div>
                </div>
            </header>

            <div class="grid-section">
                <div class="grid-title">블렌드 (Blend) <span class="grid-desc">1kg 단위</span></div>
                <div class="product-grid" id="grid-blend"></div>
            </div>
            
            <div class="grid-section">
                <div class="grid-title" style="color: #a3e635;">디카페인 (Decaf) <span class="grid-desc">최소 200g / 100g 단위</span></div>
                <div class="product-grid" id="grid-decaf"></div>
            </div>

            <div class="grid-section">
                <div class="grid-title">싱글 오리진 (Single) <span class="grid-desc">최소 200g / 100g 단위</span></div>
                <div class="product-grid" id="grid-single"></div>
            </div>
            
            <div class="history-section">
                <div class="grid-title" style="border-left-color: #666; color: #ccc;">
                    최근 주문 내역
                    <span class="grid-desc">로스팅 전(오전 11시)까지 취소 가능</span>
                </div>
                <div id="historyList">
                    <div style="text-align:center; padding: 20px; color:#444;">내역을 불러오는 중...</div>
                </div>
            </div>

            <div style="height: 400px;"></div>

            <div class="cart-section" id="cartSection">
                <div class="cart-header" onclick="toggleCart()">
                    <div style="display:flex; align-items:center;">
                        <span style="font-weight:bold; color:var(--accent-blue);">현재 담은 목록</span>
                        <span class="cart-toggle-icon">▼</span>
                    </div>
                    <span id="total-weight" style="color:#fff; font-weight:bold;">0kg</span>
                </div>
                
                <div class="cart-body">
                    <div id="cartList"></div>
                    <input type="text" id="orderNote" placeholder="요청사항 (예: 굵게 갈아주세요)" style="width:100%; padding:12px; background:#333; border:1px solid #444; color:white; margin-top:15px; border-radius:8px; box-sizing:border-box;">
                </div>
            </div>

            <div class="bottom-action">
                <button id="submitBtn" class="submit-btn" disabled>주문할 품목을 선택하세요</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUjfrQ-HVivBLggiOl8vvRZynala1qqyM",
            authDomain: "roastery-f3e2e.firebaseapp.com",
            projectId: "roastery-f3e2e",
            storageBucket: "roastery-f3e2e.firebasestorage.app",
            messagingSenderId: "79814680110",
            appId: "1:79814680110:web:86aa08fe0e273fed6649bf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let products = [];
        let cart = []; 
        let currentClient = null;
        let historyUnsubscribe = null;

        document.getElementById('orderDate').valueAsDate = new Date();
        
        // 시작하자마자 DB에서 상품 불러오기
        init();

        async function init() {
            await fetchProducts(); 
        }

        // [1] DB에서 상품 정보(기본 B2B 가격 포함) 가져오기
        // [partner.html 수정] fetchProducts 함수
        async function fetchProducts() {
            try {
                // [수정 전] const q = query(collection(db, "products"), where("showPartner", "==", true));
                
                // [수정 후] where 조건 삭제 -> 일단 다 가져옴
                const q = query(collection(db, "products")); 
                const querySnapshot = await getDocs(q);
                
                products = querySnapshot.docs
                    .map(doc => {
                        const data = doc.data();
                        
                        // [추가] 데이터 필터링: showPartner가 명시적으로 false인 경우만 제외 (undefined는 통과)
                        if (data.showPartner === false) return null;

                        let type = "Single";
                        const cat = (data.category || '').toLowerCase();
                        
                        if (cat === "blend" || data.name.includes('블렌드') || data.name.includes('Blend')) {
                            type = "Blend";
                        } else if (cat === "decaf" || data.name.includes('디카페인')) {
                            type = "Decaf";
                        }
                        
                        return {
                            id: doc.id,
                            name: data.name,
                            type: type, 
                            badge: data.badge,
                            defaultPrice: data.priceB2B || data.price || 0 
                        };
                    })
                    .filter(p => p !== null); // null(숨김처리된 것) 제거

                // 이름순 정렬
                products.sort((a, b) => a.name.localeCompare(b.name));
                renderProductGrids(); 
            } catch (e) {
                console.error("상품 불러오기 실패:", e);
            }
        }

        // [★중요★] 거래처별 가격 결정 로직 (priceOverrides 적용)
        function getClientPrice(product) {
            // 로그인을 안 했거나 정보가 없으면 0원 혹은 안보이게 처리
            if (!currentClient) return 0;

            // 1. 이 거래처에 'priceOverrides' 설정이 있고, 해당 제품 가격이 적혀있는지 확인
            // 사진에 있는 구조: currentClient.priceOverrides["제품명"]
            if (currentClient.priceOverrides && currentClient.priceOverrides[product.name] !== undefined) {
                return Number(currentClient.priceOverrides[product.name]);
            }

            // 2. 특별 단가가 없으면 기본 B2B 가격 리턴
            return product.defaultPrice;
        }

        // --- 로그인 상태 변경 ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('order-section').classList.remove('hidden');
                
                try {
                    const q = query(collection(db, "clients"), where("email", "==", user.email));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        const docData = querySnapshot.docs[0].data();
                        // DB의 모든 정보(priceOverrides 포함)를 currentClient에 저장
                        currentClient = { id: querySnapshot.docs[0].id, ...docData };
                        
                        // 화면에 업체명 표시
                        let nameHtml = currentClient.name;
                        
                        // [면세/부가세 별도] 체크되어 있으면 표시
                        if (currentClient.isTaxExempt) {
                            nameHtml += ` <span style="font-size:0.8rem; color:#ffcc00; font-weight:normal;">(VAT 별도)</span>`;
                        }
                        document.getElementById('disp-name').innerHTML = nameHtml;
                        document.getElementById('disp-address').innerText = currentClient.address || "-";
                        
                        // ★ 로그인 했으니 가격 다시 계산해서 화면 갱신
                        renderProductGrids(); 
                        loadOrderHistory(currentClient.id);
                    } else {
                        document.getElementById('disp-name').innerText = "미등록 거래처";
                        alert("관리자에게 문의하세요. (DB에 정보 없음)");
                    }
                } catch (e) { console.error(e); }
            } else {
                // 로그아웃 시
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('order-section').classList.add('hidden');
                currentClient = null;
                cart = []; 
                renderCart();
                if(historyUnsubscribe) historyUnsubscribe();
            }
        });

        // 텔레그램 알림 등 유틸리티 함수
        async function sendTelegramNotification(message) {
            try {
                await fetch('/api/send-telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: message })
                });
            } catch (err) {}
        }

        function calculateDeadline(createdDate) {
            let deadline = new Date(createdDate);
            deadline.setHours(11, 0, 0, 0); 
            if (createdDate >= deadline) {
                deadline.setDate(deadline.getDate() + 1);
                deadline.setHours(11, 0, 0, 0);
            }
            while (true) {
                const day = deadline.getDay();
                if (day >= 1 && day <= 4) break;
                deadline.setDate(deadline.getDate() + 1);
            }
            return deadline;
        }

        function loadOrderHistory(clientId) {
            const historyList = document.getElementById('historyList');
            const q = query(collection(db, "orders"), where("clientId", "==", clientId));

            historyUnsubscribe = onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return { 
                        id: doc.id, 
                        ...data, 
                        created: data.createdAt ? data.createdAt.toDate() : new Date() 
                    };
                });
                orders.sort((a, b) => b.created - a.created);

                if (orders.length === 0) {
                    historyList.innerHTML = '<div style="text-align:center; padding:20px; color:#444;">주문 내역 없음</div>';
                    return;
                }
                
                const now = new Date();
                historyList.innerHTML = orders.map(order => {
                    const deadline = calculateDeadline(order.created);
                    const isCancelable = now < deadline && order.status !== 'done';
                    const days = ['일','월','화','수','목','금','토'];
                    const deadlineStr = `${days[deadline.getDay()]}요일 11:00`;
                    
                    // 총액 정보가 있으면 표시, 없으면 무게만 표시
                    const priceInfo = order.totalPrice 
                        ? `<br><span style="font-size:0.85rem; color:#aaa;">(총 ${order.totalPrice.toLocaleString()}원)</span>` 
                        : '';

                    return `
                    <div class="history-card">
                        <div>
                            <div class="h-date">${order.date}</div>
                            <div class="h-name">${order.productType}</div>
                            ${order.note ? `<div class="h-detail">📝 ${order.note}</div>` : ''}
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:flex-end;">
                            <div class="h-amount" style="margin-bottom:5px;">
                                ${order.amountKg}kg
                                ${priceInfo}
                            </div>
                            ${isCancelable 
                                ? `<button class="cancel-btn" onclick="tryCancel('${order.id}', '${deadline.toISOString()}', '${order.productType} ${order.amountKg}kg')">취소 가능</button>`
                                : `<button class="cancel-btn disabled" onclick="showContactInfo('${deadlineStr}')">취소 불가</button>`
                            }
                        </div>
                    </div>
                `}).join('');
            });
        }

        window.tryCancel = async (id, dl, txt) => {
            if (new Date() >= new Date(dl)) return alert("시간 초과");
            if(confirm("취소하시겠습니까?")) {
                await deleteDoc(doc(db, "orders", id));
                sendTelegramNotification(`🚫 [취소] ${currentClient.name} / ${txt}`);
                alert("취소되었습니다.");
            }
        };
        window.showContactInfo = (t) => alert(`마감 기준: ${t}\n문의: 010-8679-0553`);

        // 버튼 이벤트
        document.getElementById('loginBtn').addEventListener('click', () => {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('password').value;
            const email = id.includes('@') ? id : id + "@stretto.com";
            signInWithEmailAndPassword(auth, email, pw).catch(() => document.getElementById('login-msg').innerText = "아이디/비번 확인 필요");
        });
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
        window.toggleCart = () => document.getElementById('cartSection').classList.toggle('folded');

        // --- [화면 그리기] 상품 목록 ---
        // --- [화면 그리기] 상품 목록 ---
        // [수정된 함수] renderProductGrids
        // [수정된 함수] renderProductGrids (뱃지 스타일 적용)
        // [수정된 함수] renderProductGrids (부가세 계산 및 라벨 표시 적용)
        // [수정된 함수] renderProductGrids (면세 변수명 isVatFree로 통일 및 VAT 라벨 표시)
        function renderProductGrids() {
            const blendGrid = document.getElementById('grid-blend');
            const decafGrid = document.getElementById('grid-decaf');
            const singleGrid = document.getElementById('grid-single');

            const allowedList = currentClient ? currentClient.visibleProducts : null;
            const isVisible = (p) => !allowedList || allowedList.includes(p.name);

            // 가격 및 부가세 라벨 계산 헬퍼
            const getDisplayInfo = (basePrice, unitDivider = 1) => {
                if (!currentClient) return { price: 'Login..', vatLabel: '' };

                // [핵심 수정] App.tsx에서 저장하는 변수명은 'isVatFree' 입니다.
                const isVatFree = currentClient.isVatFree === true; 
                
                // 면세 거래처: 기본가(원가) 그대로 표시 / 일반 거래처: 1.1배(부가세) 가산
                const finalPrice = isVatFree ? basePrice : Math.round(basePrice * 1.1);
                
                // 단위 가격 계산 (예: 100g 단가)
                const displayPrice = Math.round(finalPrice / unitDivider);
                
                // 라벨 설정
                const vatLabel = isVatFree ? '(VAT 미적용)' : '(VAT 포함)';
                
                return { price: `${displayPrice.toLocaleString()}원`, vatLabel };
            };

            const createCardHtml = (p, mode) => {
                const item = cart.find(c => c.name === p.name);
                const isActive = item ? 'active' : '';
                const badge = item ? `<div class="count-badge">✔ 총 ${item.qty}kg</div>` : '';

                let styleClass = '';
                let unitText = '';
                let clickAction = '';
                let unitBadgeHtml = ''; 
                
                // getClientPrice는 B2B 원가(부가세 별도)를 가져옵니다.
                const basePrice = currentClient ? getClientPrice(p) : 0;
                let displayInfo = { price: 'Login..', vatLabel: '' };

                // 1. 블렌드 (1kg 기준)
                if (mode === 'std') {
                    styleClass = ''; 
                    displayInfo = getDisplayInfo(basePrice, 1); 
                    unitText = '/kg';
                    clickAction = `addToCart('${p.name}', '${p.type}', 1.0)`;
                    unitBadgeHtml = `<div class="p-sub" style="color:var(--accent-blue)">블렌드</div>`;
                } 
                // 2. 싱글/디카페인 (100g 기준)
                else if (mode === '100g') {
                    styleClass = 'single';
                    displayInfo = getDisplayInfo(basePrice, 10); // 100g 단가
                    unitText = '/100g';
                    clickAction = `addToCart('${p.name}', '${p.type}', 0.1)`;
                    unitBadgeHtml = `<span class="unit-badge badge-small">100g 단위</span>`;
                }
                // 3. 싱글/디카페인 (1kg 팩 기준)
                else if (mode === '1kg') {
                    styleClass = 'single pack-1kg';
                    displayInfo = getDisplayInfo(basePrice, 1); // 1kg 단가
                    unitText = '/kg';
                    clickAction = `addToCart('${p.name}', '${p.type}', 1.0)`;
                    unitBadgeHtml = `<span class="unit-badge badge-bulk">1kg PACK</span>`;
                }

                return `
                <div class="product-btn ${styleClass} ${isActive}" onclick="${clickAction}">
                    ${badge}
                    <div>
                        ${mode !== 'std' ? unitBadgeHtml : ''}
                        <div class="p-name" style="${mode !== 'std' ? 'margin-top:4px;' : ''}">${p.name}</div>
                        ${mode === 'std' ? unitBadgeHtml : ''}
                    </div>
                    <div style="text-align:right; margin-top:10px;">
                        <div style="font-size:0.9rem; font-weight:bold; color:#fff;">
                            ${displayInfo.price}<span style="font-size:0.7rem; font-weight:normal; color:#888;"> ${unitText}</span>
                        </div>
                        <div style="font-size:0.65rem; color:#aaa; margin-top:2px;">
                            ${displayInfo.vatLabel}
                        </div>
                    </div>
                </div>`;
            };

            const renderList = (type, gridEl) => {
                const filtered = products.filter(p => p.type === type && isVisible(p));
                gridEl.innerHTML = filtered.map(p => {
                    if (type === 'Blend') return createCardHtml(p, 'std');
                    else return createCardHtml(p, '100g') + createCardHtml(p, '1kg');
                }).join('');
                gridEl.parentElement.style.display = gridEl.innerHTML === '' ? 'none' : 'block';
            };

            renderList('Blend', blendGrid);
            renderList('Decaf', decafGrid);
            renderList('Single', singleGrid);
        }
        // [수정된 함수] addToCart (변수명 isVatFree 로 수정)
        window.addToCart = (productName, type, fixedQty = null) => {
            if (!currentClient) return alert("로그인이 필요합니다.");

            const product = products.find(p => p.name === productName);
            const basePrice = getClientPrice(product);

            // [핵심 수정] isTaxExempt -> isVatFree로 변경
            let finalPrice = basePrice;
            if (!currentClient.isVatFree) { 
                finalPrice = Math.round(basePrice * 1.1); // 과세 사업자만 부가세 추가
            }

            const existing = cart.find(item => item.name === productName);
            
            let qtyToAdd = fixedQty ? fixedQty : ((type === 'Single' || type === 'Decaf') ? 0.1 : 1);

            if (existing) {
                existing.qty = parseFloat((existing.qty + qtyToAdd).toFixed(1));
                existing.price = finalPrice; 
            } else {
                let initialQty = fixedQty ? fixedQty : ((type === 'Single' || type === 'Decaf') ? 0.2 : 1);
                cart.push({ name: productName, qty: initialQty, type: type, price: finalPrice });
            }
            
            renderCart();
            renderProductGrids(); 
        };
        window.removeItem = (idx) => { cart.splice(idx, 1); renderCart(); renderProductGrids(); };

        // --- [화면 그리기] 장바구니 & 총액 ---
        function renderCart() {
            const section = document.getElementById('cartSection');
            const list = document.getElementById('cartList');
            const btn = document.getElementById('submitBtn');
            const totalWeightEl = document.getElementById('total-weight');

            if (cart.length === 0) {
                section.style.display = 'none';
                btn.disabled = true;
                btn.innerText = "주문할 품목을 선택하세요";
                btn.style.background = "#333";
                return;
            }
            section.style.display = 'block'; 

            const totalKg = cart.reduce((acc, item) => acc + item.qty, 0).toFixed(1);
            
            // ★ 총액 계산
            const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const totalPriceStr = Math.floor(totalPrice).toLocaleString();

            // 상단 표시
            totalWeightEl.innerHTML = `${totalKg}kg <span style="margin-left:8px; color:#ddd;">|</span> <span style="margin-left:8px; color:var(--accent-blue);">${totalPriceStr}원</span>`;

            btn.disabled = false;
            btn.innerHTML = `${totalPriceStr}원 주문 전송하기`;
            btn.style.background = "var(--accent-blue)";

            // 면세 안내 문구
            let vatInfo = "";
            if (currentClient && currentClient.isTaxExempt) {
                vatInfo = `<div style="text-align:right; font-size:0.8rem; color:#ffcc00; margin-bottom:10px;">※ 위 금액은 부가세 별도 금액입니다.</div>`;
            }

            list.innerHTML = vatInfo + cart.map((item, idx) => {
                const itemTotal = Math.floor(item.price * item.qty).toLocaleString();
                
                // [NEW] 싱글/디카페인일 경우 +1kg 버튼 노출 로직
                // updateQty(idx, 10)을 호출하면, 싱글/디카페인의 step인 0.1 * 10 = 1.0kg가 추가됩니다.
                let bigJumpBtn = '';
                if (item.type === 'Single' || item.type === 'Decaf') {
                    bigJumpBtn = `<button class="qty-btn" style="width:auto; padding:0 8px; font-size:0.8rem; background:#222; border:1px solid #444; margin-right:5px;" onclick="updateQty(${idx}, 10)">+1kg</button>`;
                }

                return `
                <div class="cart-item">
                    <div class="cart-info">
                        <span class="cart-name">${item.name}</span>
                        <span class="cart-type">${item.price.toLocaleString()}원/kg · 합계: ${itemTotal}원</span>
                    </div>
                    <div class="qty-control">
                        ${bigJumpBtn} <button class="qty-btn" onclick="updateQty(${idx}, -1)">-</button>
                        <div class="qty-val-box"><input type="text" class="qty-val" value="${item.qty}" readonly><span class="qty-unit">kg</span></div>
                        <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                        <button class="del-btn" onclick="removeItem(${idx})">✕</button>
                    </div>
                </div>`;
            }).join('');
        }

        // --- 주문 전송 ---
        // --- 주문 전송 ---
        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (!currentClient) return alert("오류: 거래처 정보 없음");
            
            // [추가] 날짜 검증 로직: 과거 날짜 선택 시 주문 불가
            const selectedDateVal = document.getElementById('orderDate').value; // YYYY-MM-DD
            
            // 한국 시간 기준 오늘 날짜 구하기 (YYYY-MM-DD)
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            if (selectedDateVal < todayStr) {
                alert("과거 날짜로는 주문을 접수할 수 없습니다.\n날짜를 오늘 이후로 변경해 주세요.");
                return; // 함수 종료
            }
            // [검증 종료]

            const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const totalPriceStr = Math.floor(totalPrice).toLocaleString();
            
            if (!confirm(`총 결제 예정 금액: ${totalPriceStr}원\n주문을 전송하시겠습니까?`)) return;
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "전송 중...";
            const date = document.getElementById('orderDate').value;
            const note = document.getElementById('orderNote').value;

            try {
                // 주문 저장 (단가, 총액 포함)
                const promises = cart.map(item => {
                    return addDoc(collection(db, "orders"), {
                        date: date,
                        clientId: currentClient.id,
                        clientName: currentClient.name,
                        productType: item.name,
                        amountKg: item.qty,
                        unitPrice: item.price,             // 적용된 단가 저장
                        totalPrice: item.price * item.qty, // 합계 저장
                        note: note, 
                        status: 'new', 
                        createdAt: serverTimestamp()
                    });
                });
                await Promise.all(promises);

                const orderDetails = cart.map(item => `- ${item.name}: ${item.qty}kg`).join('\n');
                const message = `🔔 [신규 주문]\n👤 ${currentClient.name}\n📅 ${date}\n💰 총액: ${totalPriceStr}원\n📝 ${note || '없음'}\n\n📦 내역:\n${orderDetails}`;
                
                sendTelegramNotification(message);

                alert("✅ 주문 완료!");
                cart = []; renderCart(); renderProductGrids(); 
                document.getElementById('orderNote').value = ''; btn.disabled = false;
            } catch (err) { console.error(err); alert("전송 실패"); btn.disabled = false; }
        });
    </script>
</body>
</html>
